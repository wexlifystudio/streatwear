<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account | Streat Wear</title>
<meta name="description" content="Log in or create your Streat Wear account to order faster and track your orders.">
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23E8352E'/%3E%3Ctext x='50' y='68' font-family='Arial,sans-serif' font-weight='900' font-size='42' fill='white' text-anchor='middle'%3ESW%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sw-auth.js"></script>
<style>
  :root{
    --ink:#0B0B0D; --off:#F5F3EE; --off-2:#EDEAE1;
    --red:#E8352E; --red-deep:#B8231D; --blue:#1C3F94; --gold:#F2C230; --steel:#8C8C8C;
    --line-dark: rgba(11,11,13,0.12);
    --ease: cubic-bezier(.16,.84,.44,1);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Inter',sans-serif; background:#F0F1F5; color:var(--ink); -webkit-font-smoothing:antialiased; min-height:100svh; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  input, select, textarea{ font-family:inherit; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{ outline:2px solid var(--red); outline-offset:2px; }
  .wrap{ max-width:1100px; margin:0 auto; padding:0 20px; }
  .narrow{ max-width:560px; margin:0 auto; padding:22px 16px 70px; }

  .ph{ position:sticky; top:0; z-index:60; background:#fff; border-bottom:1px solid var(--line-dark); }
  .ph .wrap{ display:flex; align-items:center; gap:12px; height:60px; }
  .ph-back{ width:38px; height:38px; border-radius:50%; border:none; background:var(--off-2); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .ph-brand{ display:flex; align-items:center; gap:9px; font-family:'Anton',sans-serif; font-size:18px; flex:1; }
  .ph-brand .mark{ width:32px; height:32px; border-radius:8px; background:linear-gradient(155deg,var(--red),var(--red-deep)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; overflow:hidden; }
  .ph-brand .mark img{ width:100%; height:100%; object-fit:cover; }
  .ph-cart{ position:relative; width:42px; height:42px; border-radius:10px; border:1.5px solid var(--line-dark); background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .ph-cart .badge{ position:absolute; top:-7px; right:-7px; min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--red); color:#fff; font-family:'Anton',sans-serif; font-size:11px; display:flex; align-items:center; justify-content:center; border:2px solid #fff; }
  .ph-cart .badge.zero{ display:none; }

  .card{ background:#fff; border-radius:16px; box-shadow:0 12px 32px -18px rgba(0,0,0,0.3); overflow:hidden; }
  .hero{ background:linear-gradient(135deg,#0B0B0D 0%,#1c1c22 60%,#2a0f0e 100%); color:var(--off); padding:26px 24px 24px; position:relative; }
  .hero::after{ content:''; position:absolute; left:0; right:0; bottom:0; height:5px; background:linear-gradient(90deg,var(--red) 0%,var(--red) 55%,var(--gold) 55%,var(--gold) 78%,var(--blue) 78%); }
  .hero h1{ font-family:'Anton',sans-serif; font-size:28px; text-transform:uppercase; }
  .hero h1 span{ color:var(--red); }
  .hero p{ margin-top:6px; font-size:13.5px; color:#B9B9B9; }

  .tabs{ display:flex; border-bottom:1px solid var(--line-dark); }
  .tabs button{ flex:1; padding:15px 10px; background:none; border:none; border-bottom:3px solid transparent; font-weight:800; font-size:13.5px; text-transform:uppercase; letter-spacing:.04em; color:#8A8A8A; }
  .tabs button.active{ color:var(--red); border-bottom-color:var(--red); }
  .pane{ padding:22px 22px 26px; }
  .pane[hidden]{ display:none; }

  .field{ margin-bottom:15px; }
  .field label{ display:block; font-size:11.5px; font-weight:800; margin-bottom:7px; text-transform:uppercase; letter-spacing:.05em; color:#3a3a3a; }
  .field input, .field select, .field textarea{ width:100%; padding:13px 14px; border-radius:8px; border:1.5px solid var(--line-dark); background:#fff; font-size:15px; color:var(--ink); transition:border-color .2s; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--red); }
  .field textarea{ resize:vertical; min-height:80px; }
  .field .hint{ font-size:12px; color:#8A8A8A; margin-top:6px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:480px){ .row2{ grid-template-columns:1fr; } }
  .pw{ position:relative; }
  .pw input{ padding-right:64px; }
  .pw button{ position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none; font-size:12px; font-weight:800; color:var(--blue); padding:8px; text-transform:uppercase; }
  .consent{ display:flex; align-items:flex-start; gap:9px; font-size:13px; color:#4a4a4a; line-height:1.45; margin-bottom:16px; cursor:pointer; }
  .consent input{ width:auto; margin-top:3px; flex-shrink:0; }
  .consent a{ color:var(--red); text-decoration:underline; }
  .btn{ width:100%; background:var(--red); color:#fff; border:none; padding:15px; border-radius:8px; font-weight:800; font-size:14.5px; text-transform:uppercase; letter-spacing:.04em; display:flex; align-items:center; justify-content:center; gap:8px; transition:background .2s, transform .2s var(--ease); }
  .btn:hover{ background:#D42920; transform:translateY(-2px); }
  .btn:disabled{ opacity:.6; cursor:not-allowed; transform:none; }
  .btn-outline{ background:#fff; color:var(--ink); border:1.5px solid var(--line-dark); }
  .btn-outline:hover{ background:var(--off-2); }
  .btn-sm{ width:auto; padding:9px 16px; font-size:12px; }
  .msg{ padding:11px 14px; border-radius:8px; font-size:13.5px; margin-bottom:16px; display:none; line-height:1.4; }
  .msg.err{ background:#FDE8E7; color:var(--red-deep); display:block; }
  .msg.ok{ background:#E3F5E9; color:#1E7A3D; display:block; }
  .swap{ text-align:center; margin-top:16px; font-size:13.5px; color:#6B6B6B; }
  .swap button{ background:none; border:none; color:var(--red); font-weight:800; font-size:13.5px; }

  /* dashboard */
  .who{ display:flex; align-items:center; gap:14px; padding:22px; }
  .avatar{ width:58px; height:58px; border-radius:50%; background:linear-gradient(135deg,var(--red),var(--gold)); color:#fff; font-family:'Anton',sans-serif; font-size:22px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .who h2{ font-size:18px; font-weight:800; }
  .who p{ font-size:13px; color:#6B6B6B; margin-top:2px; word-break:break-all; }
  .who .out{ margin-left:auto; }
  .order{ border:1px solid var(--line-dark); border-radius:12px; margin-bottom:14px; overflow:hidden; }
  .order-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 14px; background:var(--off); flex-wrap:wrap; }
  .order-head b{ font-family:'Anton',sans-serif; font-size:15px; }
  .order-head span.date{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8A8A8A; }
  .badge{ display:inline-block; padding:3px 9px; border-radius:5px; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; }
  .b-new{ background:#E3F5E9; color:#1E7A3D; } .b-contacted{ background:#FFF4D9; color:#8A6D00; } .b-confirmed{ background:#E0EAFF; color:var(--blue); } .b-done{ background:#EAEAEA; color:#555; } .b-cancelled{ background:#FDE8E7; color:var(--red-deep); }
  .order-body{ padding:12px 14px; font-size:13.5px; }
  .order-body .li{ display:flex; justify-content:space-between; gap:12px; padding:5px 0; }
  .order-body .li span:last-child{ font-family:'IBM Plex Mono',monospace; white-space:nowrap; }
  .order-total{ display:flex; justify-content:space-between; margin-top:8px; padding-top:10px; border-top:1.5px solid var(--ink); font-family:'Anton',sans-serif; font-size:16px; }
  .empty{ text-align:center; padding:40px 10px; color:#8A8A8A; font-size:14px; }
  .empty a{ display:inline-block; margin-top:14px; background:var(--red); color:#fff; padding:12px 24px; border-radius:8px; font-weight:800; font-size:13px; text-transform:uppercase; }
  .spin{ text-align:center; padding:30px; color:#8A8A8A; font-size:13px; }
  .toast{ position:fixed; left:50%; bottom:28px; transform:translate(-50%,20px); z-index:120; background:var(--ink); color:#fff; padding:12px 20px; border-radius:10px; font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:all .3s var(--ease); }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>

<header class="ph">
  <div class="wrap">
    <button class="ph-back" id="backBtn" aria-label="Go back"><svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <a href="index.html" class="ph-brand"><span class="mark" id="brandMark">SW</span><span id="brandText">STREAT WEAR</span></a>
    <a href="index.html?cart=1" class="ph-cart" aria-label="Open cart">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none"><path d="M2 2h2l1.5 9.5h8L15 4H5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="13.5" r="1.1" fill="currentColor"/><circle cx="12.5" cy="13.5" r="1.1" fill="currentColor"/></svg>
      <span class="badge zero" id="cartBadge">0</span>
    </a>
  </div>
</header>

<main class="narrow">

  <!-- ============ LOGGED OUT: Login / Sign up ============ -->
  <div class="card" id="authView">
    <div class="hero">
      <h1>Your <span>account</span></h1>
      <p>Order faster, save your delivery address and track your orders.</p>
    </div>
    <div class="tabs">
      <button type="button" class="active" data-tab="login">Login</button>
      <button type="button" data-tab="signup">Sign up</button>
    </div>

    <form class="pane" id="loginForm" novalidate>
      <div class="msg" id="loginMsg" role="alert"></div>
      <div class="field"><label for="liIdent">Email or phone number</label><input id="liIdent" type="text" autocomplete="username" placeholder="you@email.com or 01XXXXXXXXX" required></div>
      <div class="field"><label for="liPass">Password</label><div class="pw"><input id="liPass" type="password" autocomplete="current-password" placeholder="Your password" required><button type="button" class="pw-toggle" data-for="liPass">Show</button></div></div>
      <button class="btn" type="submit" id="loginBtn">Log in</button>
      <p class="swap">New here? <button type="button" data-go="signup">Create an account</button></p>
    </form>

    <form class="pane" id="signupForm" hidden novalidate>
      <div class="msg" id="signupMsg" role="alert"></div>
      <div class="field"><label for="suName">Full name</label><input id="suName" type="text" autocomplete="name" placeholder="Your full name" maxlength="80" required></div>
      <div class="field"><label for="suPhone">Phone number</label><input id="suPhone" type="tel" autocomplete="tel" inputmode="tel" placeholder="01XXXXXXXXX" maxlength="20" required></div>
      <div class="field"><label for="suEmail">Email</label><input id="suEmail" type="email" autocomplete="email" placeholder="you@email.com" required></div>
      <div class="field"><label for="suPass">Password</label><div class="pw"><input id="suPass" type="password" autocomplete="new-password" placeholder="At least 8 characters" required><button type="button" class="pw-toggle" data-for="suPass">Show</button></div></div>
      <div class="field"><label for="suPass2">Confirm password</label><div class="pw"><input id="suPass2" type="password" autocomplete="new-password" placeholder="Type the password again" required><button type="button" class="pw-toggle" data-for="suPass2">Show</button></div></div>
      <label class="consent"><input type="checkbox" id="suConsent"><span>I agree to the <a href="privacy-policy.html" target="_blank" rel="noopener">Privacy Policy</a> and <a href="terms-of-service.html" target="_blank" rel="noopener">Terms</a>.</span></label>
      <button class="btn" type="submit" id="signupBtn">Create account</button>
      <p class="swap">Already have an account? <button type="button" data-go="login">Log in</button></p>
    </form>
  </div>

  <!-- ============ LOGGED IN: dashboard ============ -->
  <div class="card" id="dashView" hidden>
    <div class="who">
      <div class="avatar" id="dAvatar">?</div>
      <div><h2 id="dName"></h2><p id="dEmail"></p><p id="dPhone"></p></div>
      <button class="btn btn-outline btn-sm out" type="button" id="logoutBtn">Log out</button>
    </div>
    <div class="tabs">
      <button type="button" class="active" data-dtab="orders">My orders</button>
      <button type="button" data-dtab="profile">Profile &amp; address</button>
    </div>

    <div class="pane" id="ordersPane"><div class="spin">Loading your orders…</div></div>

    <form class="pane" id="profileForm" hidden novalidate>
      <div class="msg" id="profileMsg" role="alert"></div>
      <div class="field"><label for="pName">Full name</label><input id="pName" type="text" maxlength="80" required></div>
      <div class="field"><label for="pPhone">Phone number</label><input id="pPhone" type="tel" inputmode="tel" maxlength="20" required></div>
      <div class="field"><label for="pEmail">Email</label><input id="pEmail" type="email" disabled><div class="hint">Email can't be changed.</div></div>
      <h3 style="font-family:'Anton',sans-serif; font-size:16px; text-transform:uppercase; margin:22px 0 12px;">Saved delivery address</h3>
      <div class="row2">
        <div class="field"><label for="pDivision">Division</label><select id="pDivision"></select></div>
        <div class="field"><label for="pDistrict">District</label><select id="pDistrict" disabled></select></div>
      </div>
      <div class="field"><label for="pArea">Thana / Upazila / Area</label><input id="pArea" type="text" placeholder="e.g. Mirpur 10" maxlength="120"></div>
      <div class="field"><label for="pFull">Full address</label><textarea id="pFull" placeholder="House / flat no, road, block, village…" maxlength="400"></textarea></div>
      <div class="field"><label for="pLandmark">Landmark (optional)</label><input id="pLandmark" type="text" placeholder="Near mosque, school, market…" maxlength="160"></div>
      <button class="btn" type="submit" id="profileBtn">Save changes</button>
    </form>
  </div>

</main>
<div class="toast" id="toast"></div>

<script>
  const sb = window.supabase.createClient('https://yoplgehukotgvhwuavdv.supabase.co', 'sb_publishable_pjynt4JKSOGlzcquZKWolQ_c6bCgQMK');
  const $ = (id) => document.getElementById(id);
  const CART_KEY = 'streatwear_cart_v1';
  function esc(s){ if(s === null || s === undefined) return ''; const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }

  function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(()=> el.classList.remove('show'), 2400); }
  function setMsg(id, type, text){ const m = $(id); m.className = 'msg' + (type ? ' ' + type : ''); m.textContent = text || ''; }

  // header bits
  try{
    const n = JSON.parse(localStorage.getItem(CART_KEY) || '[]').reduce((s,i)=> s + Number(i.qty || 0), 0);
    $('cartBadge').textContent = n; $('cartBadge').classList.toggle('zero', n === 0);
  }catch(e){}
  $('backBtn').addEventListener('click', ()=>{
    if(document.referrer && document.referrer.indexOf(location.host) !== -1 && history.length > 1) history.back(); else location.href = 'index.html';
  });
  sb.from('site_content').select('*').eq('section','branding').maybeSingle().then(({data})=>{
    const b = data && data.data; if(!b) return;
    const root = document.documentElement.style;
    if(b.primary_color) root.setProperty('--red', b.primary_color);
    if(b.primary_deep) root.setProperty('--red-deep', b.primary_deep);
    if(b.dark_bg) root.setProperty('--ink', b.dark_bg);
    if(b.gold) root.setProperty('--gold', b.gold);
    if(b.blue) root.setProperty('--blue', b.blue);
    if(b.logo_type === 'image' && b.logo_image_url) $('brandMark').innerHTML = '<img src="' + esc(b.logo_image_url) + '" alt="Logo">';
    else if(b.logo_text) $('brandMark').textContent = b.logo_text;
    if(b.brand_name) $('brandText').textContent = b.brand_name;
  });

  // ---------- tabs ----------
  function showAuthTab(which){
    document.querySelectorAll('#authView .tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === which));
    $('loginForm').hidden = which !== 'login';
    $('signupForm').hidden = which !== 'signup';
    setMsg('loginMsg'); setMsg('signupMsg');
  }
  document.querySelectorAll('#authView .tabs button').forEach(b => b.addEventListener('click', ()=> showAuthTab(b.dataset.tab)));
  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', ()=> showAuthTab(b.dataset.go)));
  if(location.hash === '#signup') showAuthTab('signup');

  document.querySelectorAll('.pw-toggle').forEach(btn => btn.addEventListener('click', ()=>{
    const inp = $(btn.dataset.for);
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    btn.textContent = show ? 'Hide' : 'Show';
  }));

  // ---------- login ----------
  $('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const ident = $('liIdent').value.trim(), pass = $('liPass').value;
    if(!ident || !pass){ setMsg('loginMsg','err','Please enter your email/phone and password.'); return; }
    const btn = $('loginBtn'); btn.disabled = true; btn.textContent = 'Logging in…'; setMsg('loginMsg');
    try{
      await SWAuth.login(ident, pass);
      $('loginForm').reset();
      toast('Welcome back!');
    }catch(err){ setMsg('loginMsg','err', err.message); }
    finally{ btn.disabled = false; btn.textContent = 'Log in'; }
  });

  // ---------- signup ----------
  $('signupForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const name = $('suName').value.trim(), phone = $('suPhone').value.trim(), email = $('suEmail').value.trim();
    const p1 = $('suPass').value, p2 = $('suPass2').value;
    let problem = '';
    if(name.length < 2) problem = 'Please enter your full name.';
    else if(!/^(\+?88)?01[3-9][0-9]{8}$/.test(phone.replace(/[\s-]/g,''))) problem = 'Enter a valid mobile number like 01XXXXXXXXX.';
    else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) problem = 'Enter a valid email address.';
    else if(p1.length < 8) problem = 'Password must be at least 8 characters.';
    else if(p1 !== p2) problem = 'Passwords do not match.';
    else if(!$('suConsent').checked) problem = 'Please agree to the Privacy Policy to continue.';
    if(problem){ setMsg('signupMsg','err', problem); return; }
    const btn = $('signupBtn'); btn.disabled = true; btn.textContent = 'Creating account…'; setMsg('signupMsg');
    try{
      await SWAuth.signup({ name, phone, email, password:p1 });
      $('signupForm').reset();
      toast('Account created!');
    }catch(err){ setMsg('signupMsg','err', err.message); }
    finally{ btn.disabled = false; btn.textContent = 'Create account'; }
  });

  // ---------- dashboard ----------
  SWAuth.setupGeo($('pDivision'), $('pDistrict'));
  document.querySelectorAll('[data-dtab]').forEach(b => b.addEventListener('click', ()=> showDashTab(b.dataset.dtab)));
  function showDashTab(which){
    document.querySelectorAll('[data-dtab]').forEach(b => b.classList.toggle('active', b.dataset.dtab === which));
    $('ordersPane').hidden = which !== 'orders';
    $('profileForm').hidden = which !== 'profile';
    if(which === 'orders') loadOrders();
  }

  function fillProfile(c){
    $('dAvatar').textContent = (c.name || '?').trim().charAt(0).toUpperCase();
    $('dName').textContent = c.name || '';
    $('dEmail').textContent = c.email || '';
    $('dPhone').textContent = c.phone || '';
    $('pName').value = c.name || '';
    $('pPhone').value = c.phone || '';
    $('pEmail').value = c.email || '';
    const a = c.address || {};
    SWAuth.setGeoValues($('pDivision'), $('pDistrict'), a.division, a.district);
    $('pArea').value = a.area || '';
    $('pFull').value = a.full || '';
    $('pLandmark').value = a.landmark || '';
  }

  let lastUserId = null;
  SWAuth.onChange((c)=>{
    const loggedIn = !!(c && SWAuth.isLoggedIn());
    $('authView').hidden = loggedIn;
    $('dashView').hidden = !loggedIn;
    if(loggedIn){
      fillProfile(c);
      if(lastUserId !== c.id){ lastUserId = c.id; showDashTab('orders'); }
    } else { lastUserId = null; }
  });

  $('logoutBtn').addEventListener('click', async ()=>{ await SWAuth.logout(); showAuthTab('login'); toast('Logged out'); });

  $('profileForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const btn = $('profileBtn'); btn.disabled = true; btn.textContent = 'Saving…'; setMsg('profileMsg');
    const address = {
      division: $('pDivision').value, district: $('pDistrict').value,
      area: $('pArea').value.trim(), full: $('pFull').value.trim(), landmark: $('pLandmark').value.trim()
    };
    const hasAddr = address.division || address.district || address.area || address.full || address.landmark;
    try{
      await SWAuth.updateProfile({ name:$('pName').value, phone:$('pPhone').value, address: hasAddr ? address : null });
      setMsg('profileMsg','ok','Saved ✓ Your details will be filled in automatically when you order.');
    }catch(err){ setMsg('profileMsg','err', err.message); }
    finally{ btn.disabled = false; btn.textContent = 'Save changes'; }
  });

  // ---------- orders ----------
  const STATUS = { new:['Order received','b-new'], contacted:['We contacted you','b-contacted'], confirmed:['Confirmed','b-confirmed'], done:['Completed','b-done'], cancelled:['Cancelled','b-cancelled'] };
  function parseOrder(d){
    d = d || '';
    const items = []; let total = 0;
    d.split('\n').forEach(ln => {
      const m = ln.match(/^•\s+(.+?)\s+\[QTY:(\d+)\]\s+\[PRICE:(\d+(?:\.\d+)?)\]\s+\[SUB:(\d+(?:\.\d+)?)\]/);
      if(m) items.push({ name:m[1], qty:Number(m[2]), sub:Number(m[4]) });
      const t = ln.match(/\[TOTAL:(\d+(?:\.\d+)?)\]/); if(t) total = Number(t[1]);
    });
    const free = d.replace(/\[CART_ORDER\][\s\S]*?\[TOTAL:\d+(?:\.\d+)?\]/g,'').replace(/\[ADDRESS\][\s\S]*?\[\/ADDRESS\]/g,'').replace(/\[CUSTOMER:[^\]]*\]/g,'').trim();
    return { items, total, free };
  }
  async function loadOrders(){
    const pane = $('ordersPane');
    pane.innerHTML = '<div class="spin">Loading your orders…</div>';
    try{
      const rows = await SWAuth.orders();
      if(!rows || !rows.length){
        pane.innerHTML = '<div class="empty">You have no orders yet.<br><a href="index.html#drops">Start shopping</a></div>';
        return;
      }
      pane.innerHTML = rows.map(o => {
        const p = parseOrder(o.details);
        const st = STATUS[o.status] || STATUS.new;
        return '<div class="order"><div class="order-head"><div><b>#' + esc(String(o.id).slice(0,8).toUpperCase()) + '</b> <span class="date">' + esc(new Date(o.created_at).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' })) + '</span></div><span class="badge ' + st[1] + '">' + st[0] + '</span></div><div class="order-body">' +
          (p.items.length
            ? p.items.map(i => '<div class="li"><span>' + esc(i.name) + ' × ' + i.qty + '</span><span>৳' + i.sub.toLocaleString() + '</span></div>').join('') + '<div class="order-total"><span>Total</span><span>৳' + p.total.toLocaleString() + '</span></div>'
            : '<div style="white-space:pre-wrap">' + (esc(p.free) || 'Order request') + '</div>') +
          '</div></div>';
      }).join('');
    }catch(err){
      pane.innerHTML = '<div class="msg err">' + esc(err.message) + '</div>';
    }
  }

  SWAuth.init(sb);
</script>
